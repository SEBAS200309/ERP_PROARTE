services:
  postgres:
    image: postgres:15-alpine
    container_name: proarte-postgres
    environment:
      POSTGRES_DB: erp_proarte
      POSTGRES_USER: proarte_app
      POSTGRES_PASSWORD: proarte_dev_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proarte_app -d erp_proarte"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
