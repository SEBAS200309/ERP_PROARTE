<div class="rol-list-container">
    <header class="list-header">
        <h1>Gestión de Roles</h1>
        @if (canCreate) {
        <app-animated-button variant="primary" ariaLabel="Crear nuevo rol" (buttonClick)="createRol()">
            + Nuevo Rol
        </app-animated-button>
        }
    </header>

    <app-data-table [columns]="columns" [data]="roles()" [permissions]="permissions" [loading]="loading()"
        [totalItems]="totalItems()" [pageSize]="pageSize()" [currentPage]="currentPage()"
        emptyMessage="No se encontraron roles" (viewAction)="onView($event)" (editAction)="onEdit($event)"
        (deleteAction)="onDelete($event)" (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)"
        (searchChange)="onSearchChange($event)" />

    <app-confirm-dialog [visible]="showDeleteDialog()" title="Eliminar Rol"
        message="¿Está seguro que desea eliminar este rol? Esta acción no se puede deshacer."
        (confirmed)="confirmDelete()" (cancelled)="cancelDelete()" />
</div>
