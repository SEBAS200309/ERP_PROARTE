<div class="lead-form-container">
  <header class="form-header">
    <h1>{{ pageTitle() }}</h1>
  </header>

  @if (loading()) {
    <div class="loading-state">
      <p>Cargando datos del lead...</p>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="save()" class="lead-form">
      <div class="form-field">
        <label for="descripcion">Descripción</label>
        <textarea
          id="descripcion"
          formControlName="descripcion"
          placeholder="Descripción del lead"
          rows="4"
        ></textarea>
        @if (hasError('descripcion', 'required')) {
          <span class="error-message">La descripción es obligatoria</span>
        }
      </div>

      <div class="form-field">
        <label for="estadoId">Estado</label>
        <select id="estadoId" formControlName="estadoId">
          <option value="">Seleccione un estado</option>
          @for (estado of estados(); track estado.id) {
            <option [value]="estado.id">{{ estado.nombre }}</option>
          }
        </select>
      </div>

      <div class="form-field">
        <label for="personaId">Persona asociada</label>
        <select id="personaId" formControlName="personaId">
          <option value="">Sin persona asociada</option>
          @for (persona of personas(); track persona.id) {
            <option [value]="persona.id">{{ persona.nombres }} {{ persona.apellidos }}</option>
          }
        </select>
      </div>

      <div class="form-field">
        <label for="empresaId">Empresa asociada</label>
        <select id="empresaId" formControlName="empresaId">
          <option value="">Sin empresa asociada</option>
          @for (empresa of empresas(); track empresa.id) {
            <option [value]="empresa.id">{{ empresa.razonSocial }}</option>
          }
        </select>
      </div>

      <div class="form-actions">
        <app-animated-button
          variant="secondary"
          type="button"
          ariaLabel="Cancelar"
          (buttonClick)="cancel()">
          Cancelar
        </app-animated-button>
        <app-animated-button
          variant="primary"
          type="submit"
          [disabled]="form.invalid || saving()"
          [loading]="saving()"
          ariaLabel="Guardar lead">
          {{ saving() ? 'Guardando...' : 'Guardar' }}
        </app-animated-button>
      </div>
    </form>
  }
</div>
