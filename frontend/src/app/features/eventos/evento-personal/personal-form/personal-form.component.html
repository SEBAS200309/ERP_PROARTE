<div class="personal-form">
  <h3 class="form-title">
    {{ isEditing() ? 'Editar Proveedor' : 'Agregar Proveedor al Evento' }}
  </h3>

  <div class="form-grid">
    @if (!isEditing()) {
      <div class="form-group">
        <label for="proveedorId">Proveedor (Personal) *</label>
        <select id="proveedorId" [(ngModel)]="proveedorId">
          <option value="">Seleccionar proveedor...</option>
          @for (proveedor of proveedoresOptions(); track proveedor.id) {
            <option [value]="proveedor.id">{{ proveedor.nombre }}</option>
          }
        </select>
      </div>
    }

    <div class="form-group">
      <label for="servicioId">Servicio</label>
      <select id="servicioId" [(ngModel)]="servicioId">
        <option value="">Sin servicio</option>
        @for (servicio of serviciosOptions(); track servicio.id) {
          <option [value]="servicio.id">{{ servicio.nombre }}</option>
        }
      </select>
    </div>

    <div class="form-group checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="tieneArl" />
        Tiene ARL
      </label>
      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="tieneOp" />
        Tiene Orden de Prestación
      </label>
    </div>

    <div class="form-group full-width">
      <label for="observaciones">Observaciones</label>
      <textarea
        id="observaciones"
        [(ngModel)]="observaciones"
        placeholder="Observaciones del proveedor..."
        rows="3">
      </textarea>
    </div>
  </div>

  <div class="form-actions">
    <app-animated-button
      variant="primary"
      [ariaLabel]="isEditing() ? 'Guardar cambios' : 'Agregar proveedor'"
      [disabled]="!isEditing() && !proveedorId"
      (buttonClick)="submitForm()">
      {{ isEditing() ? 'Guardar' : 'Agregar' }}
    </app-animated-button>

    @if (isEditing()) {
      <app-animated-button
        variant="ghost"
        ariaLabel="Cancelar edición"
        (buttonClick)="cancel()">
        Cancelar
      </app-animated-button>
    }
  </div>
</div>
