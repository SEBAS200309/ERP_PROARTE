<div class="persona-form-container">
  <header class="form-header">
    <h1>{{ pageTitle() }}</h1>
  </header>

  @if (loading()) {
    <div class="loading-state">
      <p>Cargando datos de la persona...</p>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="save()" class="persona-form">
      <div class="form-field">
        <label for="nombres">Nombres</label>
        <input
          id="nombres"
          type="text"
          formControlName="nombres"
          placeholder="Nombres de la persona"
        />
        @if (hasError('nombres', 'required')) {
          <span class="error-message">Los nombres son obligatorios</span>
        }
      </div>

      <div class="form-field">
        <label for="apellidos">Apellidos</label>
        <input
          id="apellidos"
          type="text"
          formControlName="apellidos"
          placeholder="Apellidos de la persona"
        />
        @if (hasError('apellidos', 'required')) {
          <span class="error-message">Los apellidos son obligatorios</span>
        }
      </div>

      <div class="form-field">
        <label for="tipoDocumentoId">Tipo de Documento</label>
        <select id="tipoDocumentoId" formControlName="tipoDocumentoId">
          <option value="">Seleccione un tipo</option>
          @for (tipo of tiposDocumento(); track tipo.id) {
            <option [value]="tipo.id">{{ tipo.nombre }}</option>
          }
        </select>
      </div>

      <div class="form-field">
        <label for="documento">Documento</label>
        <input
          id="documento"
          type="text"
          formControlName="documento"
          placeholder="Número de documento"
        />
      </div>

      <div class="form-field">
        <label for="telefono">Teléfono</label>
        <input
          id="telefono"
          type="text"
          formControlName="telefono"
          placeholder="Teléfono de contacto"
        />
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Correo electrónico"
        />
      </div>

      <div class="form-field">
        <label for="direccion">Dirección</label>
        <input
          id="direccion"
          type="text"
          formControlName="direccion"
          placeholder="Dirección"
        />
      </div>

      <div class="form-field">
        <label for="rolEntidadId">Rol de Entidad</label>
        <select id="rolEntidadId" formControlName="rolEntidadId">
          <option value="">Seleccione un rol</option>
          @for (rol of rolesEntidad(); track rol.id) {
            <option [value]="rol.id">{{ rol.nombre }}</option>
          }
        </select>
      </div>

      <div class="form-actions">
        <app-animated-button
          variant="secondary"
          type="button"
          ariaLabel="Cancelar"
          (buttonClick)="cancel()">
          Cancelar
        </app-animated-button>
        <app-animated-button
          variant="primary"
          type="submit"
          [disabled]="form.invalid || saving()"
          [loading]="saving()"
          ariaLabel="Guardar persona">
          {{ saving() ? 'Guardando...' : 'Guardar' }}
        </app-animated-button>
      </div>
    </form>
  }
</div>
