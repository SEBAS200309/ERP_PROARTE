<div class="mensaje-list-container">
  <header class="list-header">
    <h1>Gestión de Mensajes</h1>
    <div class="header-actions">
      @if (canCreate) {
        <app-animated-button
          variant="primary"
          ariaLabel="Crear nuevo mensaje"
          (buttonClick)="createMensaje()">
          + Nuevo Mensaje
        </app-animated-button>
      }
    </div>
  </header>

  <app-data-table
    [columns]="columns"
    [data]="mensajes()"
    [permissions]="permissions"
    [loading]="loading()"
    [totalItems]="totalItems()"
    [pageSize]="pageSize()"
    [currentPage]="currentPage()"
    emptyMessage="No se encontraron mensajes"
    (viewAction)="onView($event)"
    (editAction)="onEdit($event)"
    (deleteAction)="onDelete($event)"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (searchChange)="onSearchChange($event)"
  />

  <app-confirm-dialog
    [visible]="showDeleteDialog()"
    title="Eliminar Mensaje"
    message="¿Está seguro que desea eliminar este mensaje? Esta acción no se puede deshacer."
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  />
</div>
