spring:
  datasource:
    url: jdbc:tc:postgresql:15:///erp_proarte_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

app:
  jwt:
    secret: test-secret-key-for-integration-tests-minimum-256-bits-long-value-here
    access-token-expiration: 3600000
    refresh-token-expiration: 86400000
  cors:
    allowed-origins:
      - http://localhost:4200

logging:
  level:
    com.proarte.erp: WARN
